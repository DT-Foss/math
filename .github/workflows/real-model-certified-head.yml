name: real-model-certified-head
on:
  push:
    branches: [research/david-smollm-real-e2e]
    paths:
      - experiments/tinystories_certified_subspace_head.py
      - .github/workflows/real-model-certified-head.yml
  workflow_dispatch:
jobs:
  certified-head:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.46.3" safetensors tokenizers
      - name: Run exact certified vocabulary head
        run: |
          python experiments/tinystories_certified_subspace_head.py | tee /tmp/certified_head.log
          grep '^RESULT ' /tmp/certified_head.log | sed 's/^RESULT //' > /tmp/certified_head.json
      - uses: actions/upload-artifact@v4
        with:
          name: tinystories-certified-head
          path: |
            /tmp/certified_head.json
            /tmp/certified_head.log
