name: real-model-temporal

on:
  push:
    branches:
      - research/david-smollm-real-e2e
    paths:
      - experiments/tinystories_sigma_delta_e2e.py
      - .github/workflows/real-model-temporal.yml
  workflow_dispatch:

jobs:
  tinystories-sigma-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real-model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.46.3" safetensors tokenizers
      - name: Run mixed sigma-delta compiler
        run: |
          python experiments/tinystories_sigma_delta_e2e.py | tee /tmp/tinystories_sigma_delta.log
          grep '^RESULT ' /tmp/tinystories_sigma_delta.log | sed 's/^RESULT //' > /tmp/tinystories_sigma_delta.json
      - uses: actions/upload-artifact@v4
        with:
          name: tinystories-sigma-delta-result
          path: |
            /tmp/tinystories_sigma_delta.json
            /tmp/tinystories_sigma_delta.log
